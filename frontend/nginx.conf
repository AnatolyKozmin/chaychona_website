server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Имена файлов сборки содержат хэш — их можно держать в кэше сколько угодно.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker и манифест обязаны перепроверяться при каждом заходе, иначе
  # после деплоя пользователи останутся на старой версии приложения.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
